<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de clínicas</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="headersesion">
        <img src="../Web-4Espinas/fotos-videos/logor.png" alt="Logo del hospital" class="logo">
        <h1> <center> Hospital de clínicas </center> </h1>
    </header>
    <main class="mainsesion">
        <section class="sectionsesion">
            <h2>Iniciar sesión: </h2>
            
            <form action="php/login.php" method="POST">
                <p>
                    <label for="usuario">Nombre de usuario:</label>
                    <input type="text" id="usuario" name="usuario" required>
                </p>
                <p>
                    <label for="contrasenia">Contraseña:</label>
                    <input type="password" id="contrasenia" name="contrasenia" required>
                </p>
                <p>
                    <label for="cedula">Cédula de identidad:</label>
                    <input type="text" id="cedula" name="cedula" required>
                </p>

                <button type="submit">Iniciar sesión</button>
            </form>
            
            <button><a href="pages/registro.html">Regístrate</a></button>
          <!--  <button><a href="pages/guia.html">Continuar sin sesión</a></button> -->
        </section>
        <aside class="asidesesion">
            <img src="../Web-4Espinas/fotos-videos/Ejemplo-Hospital.jpg" height="380" width="470" alt="Ejemplo Hospital">
            <img src="../Web-4Espinas/fotos-videos/Directivos-Hospital.jpg" height="380" width="470" alt="Directivos Hospital">
        </aside>
    </main>
    <footer class="footersesion">
    </footer>
    <script src="js/java.js"></script>
</body>
</html>
