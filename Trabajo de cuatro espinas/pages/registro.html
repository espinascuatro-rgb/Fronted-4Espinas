<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Hospital de clínicas</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="headersesion">
        <img src="../fotos-videos/logor.png" alt="Logo del hospital" class="logo">
        <h1>Hospital de Clínicas</h1>
    </header>
    <main class="mainsesion">
        <section class="sectionsesion">
            <h2>Registro: </h2>
            
            <form action="../php/insercion.php" method="POST">
                <p>
                    <label for="nombre">Nombre de usuario: </label>
                    <input type="text" id="nombre" name="nombre" required>
                </p>
                <p>
                    <label for="telefono">Número de teléfono: </label>
                    <input type="text" id="telefono" name="telefono">
                </p>
                <p>
                    <label for="direccion">Dirección: </label>
                    <input type="text" id="direccion" name="direccion">
                </p>
                <p>
                    <label for="CdS">Carnet de salud: </label>
                    <input type="text" id="CdS" name="CdS">
                </p>
                <p>
                    <label for="credencial">Credenciales: </label>
                    <input type="password" id="credencial" name="credencial" required>
                </p>
                <p>
                    <label for="Contrasena1">Escribe una contraseña: </label>
                    <input type="password" id="Contrasena1" name="Contrasena1" required>
                </p>
                <p>
                    <label for="cedula">Escribe tu cédula: </label>
                    <input type="text" id="cedula" name="cedula" required>
                </p>
                <button type="submit">Registrar</button>
            </form>
        </section>
        <aside class="asidesesion">
            <img src="../fotos-videos/Ejemplo-Hospital.jpg" height="380" width="470" alt="Ejemplo Hospital">
            <img src="../fotos-videos/Directivos-Hospital.jpg" height="380" width="470" alt="Directivos Hospital">
        </aside>
    </main>
    <footer>
        <p>Hospital de clínicas</p>
        <p>Todos los derechos reservados por Equio 4 Espinas</p>
    </footer>
    <script src="../js/java.js"></script>
</body>
</html>
