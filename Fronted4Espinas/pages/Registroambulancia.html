<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de registro de ambulancias</title>
</head>
<body>
<header class="headersection">
        <img src="Logo-Hospital.png" alt="Logo del hospital" class="logo">
        <h1>Hospital de clinicas.</h1>
    </header>
    <main>
        <section>
            <h2>Registro ambulancias</h2>     
            <h3>Datos del solicitante</h3>
            <p>
                <label for Nombre> Nombre del solicitante</label>
                <input type="nombre">
            </p>

            <p>
                <label for telefono> Telefono de contacto</label>
                <input type="Telefono">
            </p>
        </section>

        <section>
            <h3>Datos del paciente</h3>
            <p>
                <label for Nombre> Nombre del paciente </label>
                <input type="nombre">
            </p>

            <p>
                <label edad> Edad del paciente </label>
                <input type="Telefono">
            </p>

            <p>
                <label for Condicion> Condicion del paciente </label>
                <input type="Condicion">
            </p>
        </section>

        <section>
            <h3> Detalles del traslado </h3>
        
            <p>
                <label for Origen> Direccion de origen </label>
                <input type="Origen">
            </p>

            <p>
                <label for Destino>Destino del traslado</label>
                <input type="Destino">
            </p>
        </section>

        <section>
            <h3>Detalles del vehiculo</h3>
             <p>
                <label for ID> Numero de identificacón </label>
                <input type="ID">
            </p>

            <p>
                <label Matricula> Matricula </label>
                <input type="Matricula">
            </p>

            <p>
                <label for Marca y modelo> Marca y modelo del vehiculo </label>
                <input type="Marca y modelo">
            </p>

             <p>
                <label for tipo> tipo de ambulancia </label>
                <input type="tipo">
            </p>
          
 
  <button type="submit">Registrar traslado de ambulancia</button>


        </section>

    </main>
    <footer>
        <p>Hospital de clinicas</p>
        <p>Todos los derechos reservados por ...</p>
    </footer>
</body>
</html>
